name: Build Decoy Images

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "lifecycle-manager/**"
      - ".github/workflows/build-decoys.yml"
  pull_request:
    paths:
      - "docker/**"
      - "lifecycle-manager/**"

env:
  REGISTRY: ghcr.io
  ORG: Maya # TODO: set to your GitHub org/user

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          # context is the repo root (not docker/<type>/) because the
          # maya-crdt-sync Dockerfile has a stage that compiles the CRDT
          # engine from scripts/crdt/, which only the root context can
          # reach (kept the same for every entry here for consistency).
          # This also means this workflow only fires correctly from a checkout whose
          # root is the Maya_Deception_Tech monorepo -- if this file is ever
          # picked up from a standalone maya-k8s repo instead, these paths
          # need adjusting (and note: GitHub only auto-discovers workflows
          # under <repo-root>/.github/workflows/, not a nested
          # maya-k8s/.github/workflows/ -- this file needs to live at the
          # monorepo root to run automatically at all).
          - name: maya-web-decoy
            dockerfile: maya-k8s/docker/web/Dockerfile
            smoke_port: 80
          - name: maya-redis-decoy
            dockerfile: maya-k8s/docker/redis/Dockerfile
            smoke_port: 6379
          - name: maya-jump-decoy
            dockerfile: maya-k8s/docker/jump/Dockerfile
            smoke_port: 22
          - name: maya-crdt-sync
            dockerfile: maya-k8s/docker/crdt-sync/Dockerfile
            smoke_port: "" # long-lived daemon, no port -- see docker/crdt-sync/Dockerfile
          - name: maya-lifecycle-manager
            dockerfile: maya-k8s/lifecycle-manager/Dockerfile
            context: maya-k8s/lifecycle-manager
            smoke_port: "" # no HTTP smoke test yet, no k8s context in CI

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:latest \
            -f ${{ matrix.dockerfile }} \
            ${{ matrix.context || '.' }}

      - name: Smoke test container starts and port opens
        if: matrix.smoke_port != ''
        run: |
          CID=$(docker run -d -e DECOY_PASSWORD=ci-test-pass \
            ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:${{ github.sha }})
          sleep 5
          echo "Container logs:"
          docker logs "$CID"
          # Check the process is still running (crashed = exit code != 0 on inspect)
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CID")
          if [ "$RUNNING" != "true" ]; then
            echo "Container exited unexpectedly"
            exit 1
          fi
          docker stop "$CID"

      # TODO (later, cheap to add now the pipeline exists):
      # - name: Scan image
      #   uses: aquasecurity/trivy-action@master
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:${{ github.sha }}

      - name: Push image
        if: github.event_name == 'push'
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.ORG }}/${{ matrix.name }}:latest
