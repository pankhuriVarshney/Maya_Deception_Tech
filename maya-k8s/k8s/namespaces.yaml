apiVersion: v1
kind: Namespace
metadata:
  name: maya-decoys
  labels:
    maya.security/zone: untrusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: maya-control
  labels:
    maya.security/zone: trusted
---
apiVersion: v1
kind: Namespace
metadata:
  name: maya-telemetry
  labels:
    maya.security/zone: trusted
---
# Default-deny baseline for the decoy namespace. Nothing crosses out of
# maya-decoys unless explicitly allowed below. This is the K8s-native
# replacement for the gateway VM's iptables NAT/forward rules.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: maya-decoys
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# Decoys may talk to each other (lateral movement must feel real) and to
# the telemetry namespace (to ship logs). They get NO route to maya-control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-decoy-mesh-and-telemetry
  namespace: maya-decoys
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maya-decoys
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maya-telemetry
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
