# NodePort: reachable at localhost:30122 (ssh) / localhost:30021 (ftp),
# fixed to match kind's extraPortMappings (see scripts/1_Epic.sh).
apiVersion: v1
kind: Service
metadata:
  name: ftp-01
  namespace: maya-decoys
spec:
  type: NodePort
  selector:
    app: ftp-01
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30122
    - name: ftp
      port: 21
      targetPort: 21
      nodePort: 30021
