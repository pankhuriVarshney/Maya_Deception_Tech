# NodePort, not ClusterIP: SSH can't go through an HTTP Ingress, and this is
# jump-01's front door now that gateway-vm's NAT/forwarding role is gone.
# Fixed nodePort so it's a stable target for kind's extraPortMappings (see
# scripts/1_Epic.sh's cluster config) -- reachable at localhost:30022.
apiVersion: v1
kind: Service
metadata:
  name: jump-01
  namespace: maya-decoys
spec:
  type: NodePort
  selector:
    app: jump-01
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 30022
