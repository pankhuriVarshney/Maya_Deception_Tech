apiVersion: apps/v1
kind: Deployment
metadata:
  name: jump-01
  namespace: maya-decoys
  labels:
    maya.decoy/type: jump
    maya.decoy/tier: low
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jump-01
  template:
    metadata:
      labels:
        app: jump-01
        maya.decoy/type: jump
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      # Lets the crdt-sync sidecar below write the shared syscache emptyDir
      # as its own non-root user -- the jump container still runs as root
      # (sshd), fsGroup just adds a supplemental group on the volume.
      securityContext:
        fsGroup: 10001
      containers:
        - name: jump
          image: maya-jump:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 22
              name: ssh
          env:
            - name: DECOY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: jump-creds
                  key: password
            - name: MAYA_STATE_FILE
              value: /var/lib/.state/.syscache
          volumeMounts:
            - name: syscache
              mountPath: /var/lib/.state
          resources:
            requests:
              cpu: 100m
              memory: 350Mi
            limits:
              cpu: 500m
              memory: 512Mi
        # CRDT engine, moved out of the jump container entirely (see
        # docker/crdt-sync/Dockerfile) so the binary and its process are
        # invisible from a shell in the jump container -- separate rootfs,
        # separate PID namespace, no listening port. Shares only the
        # syscache volume, never mounted into the jump container's own
        # filesystem beyond that one directory.
        - name: crdt-sync
          image: maya-crdt-sync:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MAYA_STATE_FILE
              value: /var/lib/.state/.syscache
          volumeMounts:
            - name: syscache
              mountPath: /var/lib/.state
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: syscache
          emptyDir: {}
