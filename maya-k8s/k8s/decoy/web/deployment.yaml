apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-03
  namespace: maya-decoys
  labels:
    maya.decoy/type: web
    maya.decoy/tier: low
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-03
  template:
    metadata:
      labels:
        app: web-03
        maya.decoy/type: web
    spec:
      runtimeClassName: gvisor
      automountServiceAccountToken: false
      # Lets the crdt-sync sidecar below write the shared syscache emptyDir
      # as its own non-root user -- the web container still runs as root
      # (sshd/nginx), fsGroup just adds a supplemental group on the volume.
      securityContext:
        fsGroup: 10001
      containers:
        - name: web
          image: maya-web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 22
              name: ssh
            - containerPort: 80
              name: http
          env:
            - name: DECOY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: web-creds
                  key: password
            - name: MAYA_STATE_FILE
              value: /var/lib/.state/.syscache
            - name: MAYA_DECOY_NAME
              value: web-03
          volumeMounts:
            - name: fake-content
              mountPath: /var/www/html
            - name: syscache
              mountPath: /var/lib/.state
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # CRDT engine, moved out of the web container entirely (see
        # docker/crdt-sync/Dockerfile) so the binary and its process are
        # invisible from a shell in the web container -- separate rootfs,
        # separate PID namespace, no listening port. Shares only the
        # syscache volume, never mounted into the web container's own
        # filesystem beyond that one directory.
        - name: crdt-sync
          image: maya-crdt-sync:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MAYA_STATE_FILE
              value: /var/lib/.state/.syscache
          volumeMounts:
            - name: syscache
              mountPath: /var/lib/.state
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: fake-content
          configMap:
            name: web-content
        - name: syscache
          emptyDir: {}
