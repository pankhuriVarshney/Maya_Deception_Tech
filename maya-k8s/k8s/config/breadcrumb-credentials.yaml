# Breadcrumb / decoy-login credentials, externalized from the image build.
# In Vagrant these were hardcoded in shell (`echo "admin:fakeweb03!" | chpasswd`).
# Keeping them here means rotating a breadcrumb password doesn't require
# rebuilding a container image -- just a `kubectl apply` + pod restart.
#
# NOTE: stringData is plaintext here for readability during setup.
# Before this touches anything real, move these into sealed-secrets /
# external-secrets-operator / Vault -- plain Secrets are only base64,
# not encrypted at rest by default.
apiVersion: v1
kind: Secret
metadata:
  name: web-creds
  namespace: maya-decoys
type: Opaque
stringData:
  username: admin
  password: fakeweb03!
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-creds
  namespace: maya-decoys
type: Opaque
stringData:
  username: admin
  password: fakeredis01!
---
apiVersion: v1
kind: Secret
metadata:
  name: jump-creds
  namespace: maya-decoys
type: Opaque
stringData:
  username: admin
  password: fakejump01!
---
apiVersion: v1
kind: Secret
metadata:
  name: ftp-creds
  namespace: maya-decoys
type: Opaque
stringData:
  username: admin
  password: fakeftp01!
