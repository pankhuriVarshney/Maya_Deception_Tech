[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
# Accepted/Failed-password lines land here instead of /dev/stderr (supervisor
# can't tee to both) so process_sshd_log() in scripts/crdt/src/main.rs can
# pick up login attempts on the shared volume -- see docker/jump/entrypoint.sh
# for the direct-exec equivalent of this same redirect.
stderr_logfile=/var/lib/.state/.sshd_auth.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=1

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0