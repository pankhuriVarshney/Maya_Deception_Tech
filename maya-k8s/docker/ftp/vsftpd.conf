# Minimal decoy FTP config. Runs in the foreground (no listen forking) so
# supervisord can manage it like every other process in this image.
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
chroot_local_user=YES
allow_writeable_chroot=YES
local_umask=022
xferlog_enable=YES
xferlog_std_format=YES

# vsftpd's own seccomp sandbox conflicts with the syscall interception
# gVisor/Kata already do at the container/pod level -- isolation is
# handled one layer down, not duplicated here.
seccomp_sandbox=NO

# Passive mode needs a port range opened on the Service/NodePort side too;
# left off for now to keep this decoy reachable with just the control port.
pasv_enable=NO
