services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - maya_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - maya_network

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/maya_deception}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      CRDT_SYNC_INTERVAL: ${CRDT_SYNC_INTERVAL:-10000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - maya_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - maya_network

volumes:
  maya_mongo_data:

networks:
  maya_network:
    driver: bridge
