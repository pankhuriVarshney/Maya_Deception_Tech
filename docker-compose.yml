services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - maya_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - maya_network

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/maya_deception}
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-development}
      SIMULATION_MODE: ${SIMULATION_MODE:-true}
      CRDT_SYNC_INTERVAL: ${CRDT_SYNC_INTERVAL:-10000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      # Left empty by default -- the backend falls back to a permissive,
      # reflected-origin CORS policy so the dashboard works from
      # localhost, a LAN IP, or any other device with zero config. Set
      # CORS_ORIGINS in a .env file (comma-separated) to lock it down.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Optional -- decoy generation falls back to a deterministic
      # generator when unset, no key required to run the app.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Points K8sClient at the internal kubeconfig below rather than the
      # default ~/.kube/config -- that one addresses the kind API server as
      # 127.0.0.1:<host-port>, which inside this container means itself, not
      # the host. Generate the internal kubeconfig with:
      #   kind get kubeconfig --internal --name maya-dev > .kube/kind-internal-config
      # K8sClient logs a harmless warning and disables K8s discovery
      # (Vagrant fabric unaffected) until that file exists.
      KUBECONFIG: ${KUBECONFIG:-/kube/kind-internal-config}
      K8S_TIER_CONTEXTS: ${K8S_TIER_CONTEXTS:-gvisor=kind-maya-dev}
      # Benchmark targets (dashboard > Benchmark). Maya's jump-01 is reached
      # through the kind node's NodePort; if that name doesn't resolve on your
      # setup, set BENCHMARK_MAYA_HOST=host.docker.internal.
      BENCHMARK_MAYA_HOST: ${BENCHMARK_MAYA_HOST:-maya-dev-control-plane}
      BENCHMARK_MAYA_PORT: ${BENCHMARK_MAYA_PORT:-30022}
      BENCHMARK_PASSWORD: ${BENCHMARK_PASSWORD:-fakejump01!}
    volumes:
      - ./.kube:/kube:ro
      # Cowrie's JSON log, read-only, so the benchmark can see what Cowrie recorded.
      - bench_cowrie_logs:/bench/cowrie:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - maya_network
      - kind

  # --- Benchmark targets (see docs/EVALUATION.md and the dashboard's Benchmark page) ---
  # Reached by service name on maya_network; no ports are published, so they
  # never collide with the standalone cowrie-ssh on host port 2223.
  bench-cowrie:
    image: cowrie/cowrie:latest
    environment:
      - COWRIE_TELNET_ENABLED=no
    volumes:
      - bench_cowrie_logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped
    networks:
      - maya_network

  # Plain sshd with no honeypot: same base as the jump decoy, no monitoring.
  bench-control:
    build:
      context: ./scripts/benchmark/control
    environment:
      BENCH_PASSWORD: ${BENCHMARK_PASSWORD:-fakejump01!}
    restart: unless-stopped
    networks:
      - maya_network

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3001}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - maya_network

volumes:
  maya_mongo_data:
  bench_cowrie_logs:

networks:
  maya_network:
    driver: bridge
  # The Docker network `kind` creates automatically for its node containers
  # -- joining it lets the backend reach the control-plane container by name
  # (as the internal kubeconfig above addresses it). Must already exist
  # (i.e. the kind cluster is up) before `docker-compose up`.
  kind:
    external: true
